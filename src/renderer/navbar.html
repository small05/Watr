<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    background: #16162a;
    color: #e8e8f0;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  .navbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
    padding: 0 8px;
  }

  /* 导航按钮 */
  .nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #9898b0;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .nav-btn:hover {
    background: rgba(255,255,255,0.08);
    color: #e8e8f0;
  }
  .nav-btn:active {
    transform: scale(0.92);
  }
  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .nav-btn:disabled:hover {
    background: transparent;
    transform: none;
  }

  /* 地址栏 */
  .address-bar {
    flex: 1;
    display: flex;
    align-items: center;
    height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0 10px;
    transition: border-color 0.15s ease;
    min-width: 0;
  }
  .address-bar:focus-within {
    border-color: rgba(124, 58, 237, 0.5);
    background: rgba(255,255,255,0.08);
  }

  .address-input {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #e8e8f0;
    font-family: inherit;
    font-size: 12px;
    min-width: 0;
  }
  .address-input::placeholder {
    color: #6868a0;
  }
  .address-input::selection {
    background: rgba(124, 58, 237, 0.4);
  }

  /* 安全锁图标 */
  .lock-icon {
    font-size: 11px;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .lock-icon--secure { color: #10b981; }
  .lock-icon--insecure { color: #9898b0; }

  /* 页面标题（鼠标悬停地址栏外时显示） */
  .page-title {
    font-size: 11px;
    color: #6868a0;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-left: 8px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="navbar">
    <button class="nav-btn" id="btn-back" title="后退" disabled>◀</button>
    <button class="nav-btn" id="btn-forward" title="前进" disabled>▶</button>
    <button class="nav-btn" id="btn-reload" title="刷新">↻</button>
    <button class="nav-btn" id="btn-home" title="主页">⌂</button>

    <div class="address-bar">
      <span class="lock-icon lock-icon--insecure" id="lock-icon">○</span>
      <input
        class="address-input"
        id="address-input"
        type="text"
        placeholder="输入网址或搜索..."
        spellcheck="false"
        autocomplete="off"
      />
    </div>

    <span class="page-title" id="page-title"></span>
  </div>

  <script>
    const btnBack = document.getElementById('btn-back')
    const btnForward = document.getElementById('btn-forward')
    const btnReload = document.getElementById('btn-reload')
    const btnHome = document.getElementById('btn-home')
    const addressInput = document.getElementById('address-input')
    const lockIcon = document.getElementById('lock-icon')
    const pageTitle = document.getElementById('page-title')

    let currentUrl = ''

    // ---- 按钮事件 ----
    btnBack.addEventListener('click', () => window.navApi.goBack())
    btnForward.addEventListener('click', () => window.navApi.goForward())
    btnReload.addEventListener('click', () => window.navApi.reload())
    btnHome.addEventListener('click', () => window.navApi.goHome())

    // ---- 地址栏回车导航 ----
    addressInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = addressInput.value.trim()
        if (!url) return

        // 智能补全：非 URL 格式则添加 https://
        if (!/^https?:\/\//i.test(url)) {
          // 检查是否像域名（包含 . 且无空格）
          if (/^[^\s]+\.[^\s]+/.test(url)) {
            url = 'https://' + url
          } else {
            // 当作搜索查询
            url = 'https://www.google.com/search?q=' + encodeURIComponent(url)
          }
        }

        window.navApi.navigateTo(url)
        addressInput.blur()
      }
    })

    // 聚焦时选中全部文本
    addressInput.addEventListener('focus', () => {
      addressInput.select()
    })

    // ---- 监听主进程推送的 URL 变化 ----
    window.navApi.onUrlChanged((data) => {
      currentUrl = data.url
      addressInput.value = data.url

      // 更新前进后退按钮状态
      btnBack.disabled = !data.canGoBack
      btnForward.disabled = !data.canGoForward

      // 更新锁图标
      if (data.url.startsWith('https://')) {
        lockIcon.textContent = '🔒'
        lockIcon.className = 'lock-icon lock-icon--secure'
      } else {
        lockIcon.textContent = '○'
        lockIcon.className = 'lock-icon lock-icon--insecure'
      }

      // 更新页面标题
      pageTitle.textContent = data.title || ''
    })
  </script>
</body>
</html>
