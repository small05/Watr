<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watr Navigation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: #16162a;
      color: #e0e0f0;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* ===== Tab Bar (32px) ===== */
    .tab-bar {
      display: flex;
      align-items: center;
      height: 32px;
      background: #12122a;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: 28px;
      min-width: 80px;
      max-width: 200px;
      background: transparent;
      border: none;
      border-radius: 6px 6px 0 0;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .tab-item:hover { background: rgba(255,255,255,0.06); color: #bbb; }
    .tab-item.active {
      background: #1a1a2e;
      color: #e0e0f0;
      border-bottom: 2px solid #7c3aed;
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .tab-close {
      width: 16px; height: 16px;
      border: none; background: transparent;
      color: #666; font-size: 10px; cursor: pointer;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .tab-close:hover { background: rgba(255,255,255,0.1); color: #f44; }

    .tab-new {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      border: none; background: transparent;
      color: #666; font-size: 16px; cursor: pointer;
      border-radius: 6px; flex-shrink: 0;
    }
    .tab-new:hover { background: rgba(255,255,255,0.06); color: #aaa; }

    /* ===== Address Bar (40px) ===== */
    .address-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 40px;
      padding: 0 8px;
      background: #1a1a2e;
    }

    .nav-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      border: none; background: transparent;
      color: #999; font-size: 14px; cursor: pointer;
      border-radius: 6px; transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); color: #ddd; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .url-input {
      flex: 1;
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      color: #e0e0f0;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }
    .url-input:focus {
      border-color: #7c3aed;
      background: rgba(124,58,237,0.05);
      box-shadow: 0 0 0 2px rgba(124,58,237,0.15);
    }

    .ssl-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16,185,129,0.15);
      color: #10b981;
    }
    .ssl-badge.insecure {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
    }
  </style>
</head>
<body>
  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar">
    <!-- Tabs rendered dynamically -->
    <button class="tab-new" id="btnNewTab" title="新建标签页">+</button>
  </div>

  <!-- Address Bar -->
  <div class="address-bar">
    <button class="nav-btn" id="btnBack" title="后退" disabled>←</button>
    <button class="nav-btn" id="btnForward" title="前进" disabled>→</button>
    <button class="nav-btn" id="btnReload" title="刷新">↻</button>
    <button class="nav-btn" id="btnHome" title="主页">⌂</button>
    <span class="ssl-badge" id="sslBadge">🔒</span>
    <input class="url-input" id="urlInput" type="text"
           placeholder="输入网址或搜索..." spellcheck="false">
  </div>

  <script>
    const { watrNavbar } = window;

    const tabBar = document.getElementById('tabBar');
    const btnNewTab = document.getElementById('btnNewTab');
    const btnBack = document.getElementById('btnBack');
    const btnForward = document.getElementById('btnForward');
    const btnReload = document.getElementById('btnReload');
    const btnHome = document.getElementById('btnHome');
    const urlInput = document.getElementById('urlInput');
    const sslBadge = document.getElementById('sslBadge');

    // ---- Tab Bar ----
    function renderTabs(tabs) {
      // Remove existing tab items (keep the new-tab button)
      const existing = tabBar.querySelectorAll('.tab-item');
      existing.forEach(el => el.remove());

      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab-item' + (tab.isActive ? ' active' : '');
        el.innerHTML = `
          <span class="tab-title">${escapeHtml(tab.title)}</span>
          <button class="tab-close" data-tab-id="${tab.id}">✕</button>
        `;
        el.addEventListener('click', (e) => {
          if (!e.target.classList.contains('tab-close')) {
            watrNavbar.switchTab(tab.id);
          }
        });
        el.querySelector('.tab-close').addEventListener('click', (e) => {
          e.stopPropagation();
          watrNavbar.closeTab(tab.id);
        });
        tabBar.insertBefore(el, btnNewTab);
      });
    }

    btnNewTab.addEventListener('click', () => watrNavbar.createTab());

    // ---- Navigation Buttons ----
    btnBack.addEventListener('click', () => watrNavbar.goBack());
    btnForward.addEventListener('click', () => watrNavbar.goForward());
    btnReload.addEventListener('click', () => watrNavbar.reload());
    btnHome.addEventListener('click', () => watrNavbar.goHome());

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = urlInput.value.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url) && !url.startsWith('about:')) {
          if (/\.\w{2,}/.test(url)) {
            url = 'https://' + url;
          } else {
            url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
          }
        }
        watrNavbar.navigate(url);
        urlInput.blur();
      }
    });

    urlInput.addEventListener('focus', () => urlInput.select());

    // ---- Events from Main Process ----
    watrNavbar.onUrlChanged((data) => {
      urlInput.value = data.url === 'about:blank' ? '' : data.url;
      btnBack.disabled = !data.canGoBack;
      btnForward.disabled = !data.canGoForward;

      // SSL badge
      if (data.url.startsWith('https://')) {
        sslBadge.textContent = '🔒';
        sslBadge.className = 'ssl-badge';
      } else if (data.url.startsWith('http://')) {
        sslBadge.textContent = '⚠';
        sslBadge.className = 'ssl-badge insecure';
      } else {
        sslBadge.textContent = '';
        sslBadge.className = 'ssl-badge';
      }
    });

    watrNavbar.onTabsUpdated((tabs) => renderTabs(tabs));

    // ---- Helpers ----
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
